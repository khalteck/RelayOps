services:
  - type: web
    name: relayops-backend
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @relayops/types build && pnpm --filter @relayops/backend build
    startCommand: pnpm --filter @relayops/backend start
    initialDeployHook: pnpm --filter @relayops/backend seed
    healthCheckPath: /health/ready
    buildFilter:
      paths:
        - apps/backend/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://relayops-frontend.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REALTIME_TICKET_SECRET
        generateValue: true
      - key: AUTH_RATE_LIMIT
        value: "20"
      - key: DEMO_PASSWORD
        sync: false

  - type: web
    name: relayops-frontend
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @relayops/types build && pnpm --filter @relayops/ui build && pnpm --filter @relayops/frontend build
    staticPublishPath: ./apps/frontend/dist
    buildFilter:
      paths:
        - apps/frontend/**
        - packages/ui/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_SOCKET_URL
        value: https://relayops-backend.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://relayops-backend.onrender.com wss://relayops-backend.onrender.com; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://relayops-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
